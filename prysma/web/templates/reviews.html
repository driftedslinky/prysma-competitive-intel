<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prysma — Reviews of {name}</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg: #0b0e13; --surface: #12161d; --border: #232a35;
            --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --red: #f85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
            background: var(--bg); color: var(--text); font-size: 17px; line-height: 1.8; letter-spacing: 0.01em;
        }
        a { color: var(--accent); }
        main { max-width: 760px; margin: 0 auto; padding: 40px 24px 64px; display: grid; gap: 24px; }
        h1 { font-size: 28px; line-height: 1.3; }
        .muted { color: var(--muted); }
        .small { font-size: 15px; }
        .review { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px 28px; display: grid; gap: 10px; }
        .review h2 { font-size: 19px; line-height: 1.4; }
        .review-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 15px; }
        .stars { color: var(--red); font-weight: 600; }
        .review p { overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main>
        <p><a href="/?list={list}&amp;c={competitor_id}#competitors">← Back to {name}</a></p>
        <h1>Low-rated reviews of {name}</h1>
        <p class="muted">{count} reviews with 1 or 2 stars in the last {days} days. Newest first.</p>
        {reviews}
    </main>
    <script>
    // Times: the server writes UTC; show them in the reader's own time zone.
    for (const t of document.querySelectorAll('time.when')) {
        const d = new Date(t.getAttribute('datetime'));
        if (!isNaN(d)) {
            t.title = t.textContent;
            t.textContent = d.toLocaleString([], {day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'});
        }
    }
    </script>
</body>
</html>
